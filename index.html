<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗影试炼 · 3D 动作冒险 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #06060c; font-family: -apple-system, "PingFang SC", sans-serif; }
  #game { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; user-select: none; }

  /* ---- 左上：头像 + 描金状态条 ---- */
  #topleft { position: absolute; top: 18px; left: 18px; display: flex; gap: 12px; align-items: flex-start; }
  #portrait { width: 64px; height: 64px; border-radius: 10px; border: 2px solid #c9a227; position: relative; overflow: hidden;
              background: linear-gradient(160deg,#2a3a6a,#0e1426); box-shadow: 0 0 0 2px #1a1208, inset 0 0 18px rgba(0,0,0,.6); }
  #portrait::before { content:''; position:absolute; left:50%; top:56%; width:32px; height:36px; transform:translate(-50%,-50%);
                      border-radius:50% 50% 46% 46%; background:#f0d2a8; }
  #portrait::after { content:''; position:absolute; left:50%; top:48%; width:28px; height:6px; transform:translate(-50%,-50%);
                     border-radius:3px; background:linear-gradient(90deg,#3bd0ff,#9b6bff); box-shadow:0 0 10px #5bd0ff; }
  #bars { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
  .hbar { position: relative; border-radius: 4px; background: #0c0c16; border: 1px solid #000; overflow: hidden;
          box-shadow: inset 0 0 0 1px rgba(201,162,39,.55), 0 1px 3px #000; }
  .hbar .fill { height: 100%; width: 100%; transition: width .1s linear; box-shadow: inset 0 7px 6px -6px rgba(255,255,255,.55); }
  .hbar .cap { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,.85); text-shadow: 0 1px 1px #000; }
  #hpBar { width: 240px; height: 18px; }   #hpBar .fill { background: linear-gradient(90deg,#c81f1f,#ff6b6b); }
  #spBar { width: 210px; height: 13px; }   #spBar .fill { background: linear-gradient(90deg,#2f9e44,#7be88a); }
  #energyBar { width: 184px; height: 11px; } #energyBar .fill { background: linear-gradient(90deg,#3bd0ff,#9b6bff); }
  #energyBar.ready { box-shadow: inset 0 0 0 1px rgba(201,162,39,.55), 0 0 14px rgba(120,200,255,.95); }
  #lockTip { position: absolute; top: 92px; left: 96px; font-size: 12px; color: #ffd43b; text-shadow: 0 1px 2px #000; }

  /* ---- 任务追踪 ---- */
  #quests { position: absolute; top: 20px; right: 20px; min-width: 214px; background: rgba(10,10,20,.5);
            border: 1px solid rgba(201,162,39,.35); border-radius: 10px; padding: 12px 16px; backdrop-filter: blur(4px); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .qtitle { font-size: 12px; letter-spacing: 2px; color: #d9b84a; margin-bottom: 8px; }
  .q { font-size: 14px; color: #cdd; line-height: 1.95; opacity: .65; }
  .q .mk { display: inline-block; width: 18px; color: #778; }
  .q.active { opacity: 1; color: #fff; } .q.active .mk { color: #ffd43b; }
  .q.done { opacity: .5; color: #8ec; text-decoration: line-through; } .q.done .mk { color: #4caf50; }

  /* ---- 底部技能栏 ---- */
  #skillbar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .slot { width: 52px; height: 52px; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(160deg,#1c1c30,#0c0c16); border: 2px solid #4a4a66; box-shadow: inset 0 0 12px rgba(0,0,0,.6), 0 2px 6px #000; }
  .slot .ic { font-size: 25px; filter: drop-shadow(0 1px 2px #000); }
  .slot .kb { position: absolute; bottom: -3px; right: -3px; font-size: 10px; font-weight: 700; color: #fff; background: #222; border: 1px solid #666; border-radius: 4px; padding: 0 3px; }
  .slot .nm { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #9aa; white-space: nowrap; }
  .slot .cnt { position: absolute; top: -4px; left: -4px; font-size: 10px; font-weight: 700; color: #69ff9c; background: #103018; border: 1px solid #2a6; border-radius: 4px; padding: 0 3px; }
  .slot.lowsp { opacity: .42; } .slot.empty { opacity: .42; filter: grayscale(1); }
  .slot.ready { border-color: #5bd0ff; animation: slotpulse 1s infinite; }
  @keyframes slotpulse { 0%,100%{ box-shadow: 0 0 10px rgba(90,200,255,.6), inset 0 0 12px rgba(0,0,0,.5) } 50%{ box-shadow: 0 0 22px rgba(120,210,255,1), inset 0 0 12px rgba(0,0,0,.5) } }

  /* ---- Boss 血条 / 势条 ---- */
  #bossBar { position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%); width: 56%; max-width: 760px;
             height: 20px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,80,80,.5); border-radius: 4px; overflow: hidden; display: none; }
  #bossBar .fill { height: 100%; width: 100%; background: linear-gradient(90deg,#7a0000,#ff2e2e); transition: width .12s linear; }
  #bossName { position: absolute; bottom: 128px; left: 50%; transform: translateX(-50%); font-size: 16px; letter-spacing: 4px;
              color: #ff8a8a; text-shadow: 0 0 14px rgba(255,40,60,.7),0 2px 6px #000; display: none; }
  #postureBar { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); width: 46%; max-width: 620px;
                height: 7px; background: rgba(0,0,0,.5); border-radius: 4px; overflow: hidden; display: none; }
  #postureBar .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffb000,#ffe066); transition: width .08s linear; }
  #postureBar.broken .fill { background: linear-gradient(90deg,#ff3060,#ff90a0); }

  /* ---- Toast / 横幅 / 伤害数字 / 屏闪 / 暗角 ---- */
  #toast { position: fixed; top: 20%; left: 0; right: 0; text-align: center; color: #fff; font-size: 34px; letter-spacing: 6px; font-weight: 700;
           text-shadow: 0 4px 20px rgba(0,0,0,.8); opacity: 0; pointer-events: none; transition: opacity .4s; }
  #banner { position: fixed; top: 34%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transform: translateY(12px) scale(.9); transition: opacity .4s, transform .4s; }
  #banner.show { opacity: 1; transform: translateY(0) scale(1); }
  #banner .bt { font-size: 56px; letter-spacing: 10px; font-weight: 800; color: #ff5a5a; text-shadow: 0 0 28px rgba(255,40,60,.75),0 4px 12px #000; }
  #banner .bs { font-size: 16px; letter-spacing: 4px; color: #ffd0d0; margin-top: 10px; opacity: .9; }
  #dmgLayer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dmg { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 6px #000; will-change: transform, opacity; }
  .dmg.heavy { color: #ffb74d; font-size: 27px; }
  .dmg.crit { color: #ffe066; font-size: 37px; text-shadow: 0 0 14px rgba(255,200,40,.9),0 2px 6px #000; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 220px 64px rgba(0,0,0,.72); }

  /* ---- 开始 / 结束 ---- */
  #center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,.9)); color: #fff; text-align: center; cursor: pointer; }
  #center.hidden { display: none; }
  #center h1 { font-size: 52px; letter-spacing: 10px; margin-bottom: 12px; text-shadow: 0 0 30px rgba(90,140,255,.5),0 4px 18px rgba(255,80,80,.4); }
  #center p { font-size: 15px; opacity: .82; margin: 4px 0; line-height: 1.7; }
  #center .keys { margin-top: 22px; font-size: 13.5px; opacity: .92; line-height: 2; }
  #center .keys b { color: #ffd43b; }
  #center .big { font-size: 66px; letter-spacing: 10px; margin-bottom: 14px; }
  .win { color: #ffe066 !important; } .lose { color: #ff6b6b !important; }

  /* ---- 波间强化选择 ---- */
  #upgrade { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center;
             background: radial-gradient(ellipse at center, rgba(8,8,18,.78), rgba(2,2,6,.92)); color: #fff; }
  #upgrade.show { display: flex; }
  #upgrade h2 { font-size: 26px; letter-spacing: 6px; color: #ffd43b; margin-bottom: 22px; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  #upCards { display: flex; gap: 18px; }
  .upcard { width: 196px; min-height: 150px; padding: 18px 16px; border-radius: 14px; text-align: center;
            background: linear-gradient(160deg,#1a2034,#0b0e1a); border: 2px solid #3a4a6a;
            display: flex; flex-direction: column; gap: 9px; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .upcard .uicon { font-size: 34px; }
  .upcard .uk { font-size: 12px; letter-spacing: 1px; color: #5bd0ff; font-weight: 700; }
  .upcard .un { font-size: 19px; font-weight: 800; color: #fff; }
  .upcard .ud { font-size: 13px; color: #9fb0c8; line-height: 1.55; }
  #upgrade .tip { margin-top: 20px; font-size: 13px; opacity: .8; }
  #upgrade .tip b { color: #ffd43b; }

  /* ---- 风格评级 ---- */
  #style { position: absolute; top: 150px; right: 24px; text-align: right; opacity: 0; transition: opacity .3s; }
  #style.on { opacity: 1; }
  #style .sr { font-size: 54px; font-weight: 900; font-style: italic; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #style .sbar { width: 132px; height: 6px; margin: 5px 0 0 auto; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; }
  #style .sbar .f { height: 100%; width: 0; transition: width .15s linear; }
  #style .slabel { font-size: 11px; letter-spacing: 3px; color: #aeb6c4; margin-top: 3px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topleft">
    <div id="portrait"></div>
    <div id="bars">
      <div id="hpBar" class="hbar"><div class="fill" id="hpFill"></div><span class="cap">HP</span></div>
      <div id="spBar" class="hbar"><div class="fill" id="spFill"></div><span class="cap">耐力</span></div>
      <div id="energyBar" class="hbar"><div class="fill" id="energyFill"></div><span class="cap">影</span></div>
    </div>
  </div>
  <div id="lockTip"></div>
  <div id="quests"></div>
  <div id="style"><div class="sr" id="styleRank">D</div><div class="sbar"><div class="f" id="styleFill"></div></div><div class="slabel">风格</div></div>

  <div id="bossName">暗 影 督 军</div>
  <div id="bossBar"><div class="fill" id="bossFill"></div></div>
  <div id="postureBar"><div class="fill" id="postureFill"></div></div>

  <div id="skillbar">
    <div class="slot"><span class="nm">攻击</span><span class="ic">⚔️</span><span class="kb">L/J</span></div>
    <div class="slot" id="slotHeavy"><span class="nm">重击</span><span class="ic">🪓</span><span class="kb">K</span></div>
    <div class="slot" id="slotParry"><span class="nm">弹反</span><span class="ic">🛡️</span><span class="kb">R/Q</span></div>
    <div class="slot" id="slotDodge"><span class="nm">翻滚</span><span class="ic">💨</span><span class="kb">空格</span></div>
    <div class="slot" id="slotUlt"><span class="nm">影斩</span><span class="ic">🌀</span><span class="kb">E</span></div>
    <div class="slot" id="slotHeal"><span class="cnt" id="flaskNum">3</span><span class="nm">回血</span><span class="ic">🧪</span><span class="kb">F</span></div>
  </div>
</div>

<div id="toast"></div>
<div id="banner"></div>
<div id="dmgLayer"></div>
<div id="flash"></div>
<div id="vignette"></div>

<div id="upgrade">
  <h2>选 择 强 化</h2>
  <div id="upCards"></div>
  <div class="tip">按 <b>1 / 2 / 3</b> 选择</div>
</div>

<div id="center">
  <h1>暗 影 试 炼</h1>
  <p>卡通渲染 · 类魂动作：读招 → 闪避 / 弹反 → 反击 → 蓄力影斩。先清小鬼，再战督军。</p>
  <div class="keys">
    <b>WASD</b> 移动 · <b>鼠标</b> 视角 · <b>左键/J</b> 三连击 · <b>K</b> 重击（破防）<br>
    <b>空格</b> 翻滚（无敌帧 + 残影）· <b>右键/Q</b> 弹反（攒"势"→破势处决）· <b>Tab</b> 锁定<br>
    <b>E</b> 大招「影斩」（能量满时范围旋斩）· <b>Shift</b> 冲刺 · <b>F</b> 回血 · <b>R</b> 重开
  </div>
  <p style="margin-top:26px;font-size:18px;color:#ffd43b;">▶ 点击屏幕开始</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
